services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: tenant_vault
    ports: ['5435:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tenant_vault_app:app_password@postgres:5432/tenant_vault
      ADMIN_DATABASE_URL: postgresql+asyncpg://vault:vault@postgres:5432/tenant_vault
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-compose-dev-webhook-secret}
    ports: ['8000:8000']
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ['3000:3000']
    depends_on:
      - backend
